<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Registration Page</title>
  </head>
  <body>
    <form>
      <fieldset>
        <legend>Registration Form</legend>
        <table>
          <tr>
            <td><label for="">Fullname</label></td>
            <td><input type="text" placeholder="Enter your fullname" /></td>
          </tr>
          <tr>
            <td><label for="">Email</label></td>
            <td>
              <input
                type="email"
                name=""
                id=""
                placeholder="Enter your email"
              />
            </td>
          </tr>
          <tr>
            <td><label for="">Age</label></td>
            <td><input type="number" placeholder="Enter your age" /></td>
          </tr>
          <tr>
            <td><label>Date of Birth</label></td>
            <td><input type="date" name="" id="" /></td>
          </tr>
          <tr>
            <td><label for="">Skills</label></td>
            <td>
              <input type="checkbox" name="skills" id="" />HTML
              <input type="checkbox" name="skills" id="" />CSS
              <input type="checkbox" name="skills" id="" />JavaScript
            </td>
          </tr>
          <tr>
            <td><label for="">Marital Status</label></td>
            <td>
              <input type="radio" name="status" id="" />Single
              <input type="radio" name="status" id="" />Married
            </td>
          </tr>
          <tr>
            <td><label for="">Gender</label></td>
            <td>
              <select name="gender" id="gender">
                <option value="Select your Gender">Select your Gender</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
              </select>
            </td>
          <tr>
            <td><label for="">Password</label></td>
          <td>
              <input
                type="password"
                name=""
                placeholder="Enter your password"
              />
            </td>
          </tr>
          <tr>
            <td><input type="submit" value="submit" /></td>
          </tr>
        </table>
      </fieldset>
    </form>
  </body>
