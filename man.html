<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CSS Fundamentals</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div class="container">
        <p>Registration Form</p>
        <form action="">
            <label class="label">Fullname</label><br>
            <input type="text" placeholder="Enter your fullname" /><br>
            <label class="label">Email</label><br>
            <input type="email" placeholder="Enter your Email"><br>
            <label class="label">Age</label><br>
            <input type="number" placeholder="Enter your age" /><br>
            <label class="label">Date of Birth</label></br>
            <input type="datetime" name="" placeholder="Enter your Date of Birth"/><br>
            <label class="label">Upload your passport</label><br>
            <input type="file" /><br>
            <label for="">Password</label><br>
            <input type="password" name="" placeholder="Enter your Password"><br>
            <button>Login</button> 
        </form>
    </div>
  </body>
</html>
